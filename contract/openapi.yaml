openapi: 3.0.0
info:
  title: Call Calendar API
  version: 1.0.0
tags: []
paths:
  /:
    get:
      operationId: Site_index
      summary: UI календаря
      description: Статическая оболочка фронтенда; данные загружаются только через API.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            text/plain:
              schema:
                type: string
  /api/bookings/:
    get:
      operationId: Bookings_list
      summary: Список записей
      description: 'owner_id — int32; невалидное значение — 400, неизвестный owner даёт пустой список. Возвращает confirmed и cancelled, упорядочено по старту Slot. Сценарий владельца: предстоящие встречи — confirmed с slotStartAt ≥ now; фильтр выполняется на клиенте.'
      parameters:
        - name: owner_id
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '400':
          description: 400 — ошибка валидации запроса (параметры, сетка/слот/окно, email, поля EventType).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: 405 — метод не поддерживается.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: Bookings_create
      summary: Создание бронирования
      description: Старт — по сетке :00/:30 в рабочих часах 9:00–18:00 (Europe/Moscow; последний старт 17:30). Окно — календарными днями [today, today + 14] (Europe/Moscow), прошлое отклоняется. Наивный slotStartAt трактуется как Europe/Moscow.
      parameters: []
      responses:
        '201':
          description: 201 — запись создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: 400 — ошибка валидации запроса (параметры, сетка/слот/окно, email, поля EventType).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: 405 — метод не поддерживается.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 409 — слот уже занят.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
  /api/bookings/{id}/cancel/:
    post:
      operationId: Bookings_cancel
      summary: Отмена записи
      description: 'Идемпотентно: повторная отмена уже cancelled Booking — 200 с тем же статусом. Неизвестный id — 404. Отмена прошедшего (start ≤ now) confirmed Booking — 400.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: 400 — ошибка валидации запроса (параметры, сетка/слот/окно, email, поля EventType).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 404 — не найдено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: 405 — метод не поддерживается.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/event-types/:
    get:
      operationId: EventTypes_list
      summary: Список типов встреч владельца
      description: 'Сценарий владельца: показать типы встреч выбранного владельца. owner_id — int32; невалидное значение — 400. Неизвестный owner даёт пустой список.'
      parameters:
        - name: owner_id
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
        '400':
          description: 400 — ошибка валидации запроса (параметры, сетка/слот/окно, email, поля EventType).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: 405 — метод не поддерживается.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: EventTypes_create
      summary: Создание типа встречи
      description: 'Сценарий владельца: добавить тип встречи. owner_id должен существовать, title — непустая строка, description — строка или отсутствует, duration_minutes — только 30. Редактирование и удаление типов встреч в v1 не входят.'
      parameters: []
      responses:
        '201':
          description: 201 — тип встречи создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: 400 — ошибка валидации запроса (параметры, сетка/слот/окно, email, поля EventType).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: 405 — метод не поддерживается.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeCreate'
  /api/owners/:
    get:
      operationId: Owners_list
      summary: Список владельцев
      description: 'Сценарий владельца: источник owner_id для списков типов встреч и броней.'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Owner'
        '405':
          description: 405 — метод не поддерживается.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/slots/:
    get:
      operationId: Slots_list
      summary: Доступные слоты
      description: date — YYYY-MM-DD (Europe/Moscow), день в [today, today + 14]. Слоты 9:00–18:00 по сетке :00/:30; прошедшее время — isAvailable false. Невалидные/отсутствующие параметры, неизвестный или чужой event_type_id, неверная дата или дата вне окна — 400.
      parameters:
        - name: owner_id
          in: query
          required: true
          schema:
            type: integer
            format: int32
          explode: false
        - name: event_type_id
          in: query
          required: true
          schema:
            type: integer
            format: int32
          explode: false
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '400':
          description: 400 — ошибка валидации запроса (параметры, сетка/слот/окно, email, поля EventType).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: 405 — метод не поддерживается.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Booking:
      type: object
      required:
        - id
        - event_type_id
        - owner_id
        - slotStartAt
        - guestName
        - guestEmail
        - status
      properties:
        id:
          type: integer
          format: int32
        event_type_id:
          type: integer
          format: int32
        owner_id:
          type: integer
          format: int32
        slotStartAt:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
          description: Email гостя.
        status:
          type: string
          enum:
            - confirmed
            - cancelled
      description: 'Запись гостя на слот (GLOSSARY: Booking).'
    BookingCreate:
      type: object
      required:
        - event_type_id
        - slotStartAt
        - guestName
        - guestEmail
      properties:
        event_type_id:
          type: integer
          format: int32
        slotStartAt:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
          description: Email гостя.
      description: Тело создания записи.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      description: 'Общая ошибка API: { error: string }.'
    EventType:
      type: object
      required:
        - id
        - owner_id
        - title
        - duration_minutes
      properties:
        id:
          type: integer
          format: int32
        owner_id:
          type: integer
          format: int32
        title:
          type: string
        description:
          type: string
        duration_minutes:
          type: number
          enum:
            - 30
          description: Только 30, другие длительности не поддерживаются.
      description: 'Тип встречи владельца (GLOSSARY: EventType). duration_minutes обязан быть 30 (ADR-0001).'
    EventTypeCreate:
      type: object
      required:
        - owner_id
        - title
        - duration_minutes
      properties:
        owner_id:
          type: integer
          format: int32
        title:
          type: string
        description:
          type: string
        duration_minutes:
          type: number
          enum:
            - 30
          description: Только 30, другие длительности не поддерживаются.
      description: Тело создания типа встречи (сценарий владельца).
    Owner:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        email:
          type: string
          description: Email владельца.
      description: 'Владелец календаря (GLOSSARY: Owner).'
    Slot:
      type: object
      required:
        - startAt
        - endAt
        - isAvailable
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        isAvailable:
          type: boolean
      description: 'Слот на дату (GLOSSARY: Slot). Генерируется на лету 9:00–18:00 по сетке :00/:30.'
    Versions:
      type: string
      enum:
        - 1.0.0
      description: Версии API.
servers:
  - url: http://127.0.0.1:8000
    description: local
    variables: {}
