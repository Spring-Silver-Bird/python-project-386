name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Django check
        run: uv run python python_project_386/manage.py check
      - name: Run tests
        run: uv run pytest --cov --cov-report=term --cov-fail-under=80

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install contract toolchain
        working-directory: contract
        run: npm ci --no-audit --no-fund
      - name: Emit OpenAPI and check freshness
        working-directory: contract
        run: |
          npx tsp compile calendar.tsp --emit @typespec/openapi3
          cp tsp-output/@typespec/openapi3/openapi.*.yaml openapi.yaml
          git diff --exit-code openapi.yaml
