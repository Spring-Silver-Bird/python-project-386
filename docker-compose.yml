services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-call_calendar}
      POSTGRES_USER: ${POSTGRES_USER:-call_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-call_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-call_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-only-change-me}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-call_calendar}
      POSTGRES_USER: ${POSTGRES_USER:-call_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-call_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PORT: 8000
    ports:
      - "8000:8000"
    command: >
      sh -c "uv run python manage.py migrate --noinput &&
             uv run gunicorn python_project_386.wsgi:application --bind 0.0.0.0:8000 --workers 3"

volumes:
  pgdata:
